services:
  postgres:
    image: postgres:${POSTGRES_TAG:-16-alpine}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 5

  synapse:
    image: matrixdotorg/synapse:${SYNAPSE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_SERVER_NAME:?set MATRIX_SERVER_NAME in .env}
      SYNAPSE_REPORT_STATS: ${SYNAPSE_REPORT_STATS:-no}
      SYNAPSE_CONFIG_DIR: /data
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    command:
      - run
      - --config-path
      - /data/homeserver.yaml
      - --config-path
      - /data/extra-config.yaml
    ports:
      - "8008:8008"
    volumes:
      - ./data/synapse:/data
      - ./data/appservices:/data/appservices:ro

  element:
    image: vectorim/element-web:${ELEMENT_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - synapse
    ports:
      - "8080:80"
    volumes:
      - ./element/config.json:/app/config.json:ro

  mautrix-telegram:
    image: dock.mau.dev/mautrix/telegram:${MAUTRIX_TELEGRAM_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - synapse
    profiles: ["bridges"]
    volumes:
      - ./data/mautrix-telegram:/data

  mautrix-discord:
    image: dock.mau.dev/mautrix/discord:${MAUTRIX_DISCORD_TAG:-latest}
    extra_hosts:
      # Some cloud DNS routes Discord/Discord media domains to blocked IPs.
      # These pins are pragmatic defaults from the validated deployment.
      - "discord.com:104.23.124.189"
      - "discordapp.com:104.23.124.189"
      - "gateway.discord.gg:104.23.124.189"
      - "cdn.discordapp.com:104.23.124.189"
      - "media.discordapp.net:104.23.124.189"
      - "images-ext-1.discordapp.net:128.121.243.75"
      - "media.tenor.com:192.133.77.133"
      - "remote-auth-gateway.discord.gg:162.125.2.6"
    restart: unless-stopped
    depends_on:
      - synapse
    profiles: ["bridges"]
    volumes:
      - ./data/mautrix-discord:/data

  mautrix-slack:
    image: dock.mau.dev/mautrix/slack:${MAUTRIX_SLACK_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - synapse
    profiles: ["bridges"]
    volumes:
      - ./data/mautrix-slack:/data

  pixdesk-listener:
    build: ./services/listener
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_started
    profiles: ["agent"]
    environment:
      MATRIX_HOMESERVER: http://synapse:8008
      MATRIX_USER_ID: "@admin:${MATRIX_SERVER_NAME}"
      MATRIX_ACCESS_TOKEN: "${AGENT_ACCESS_TOKEN:?set AGENT_ACCESS_TOKEN in .env}"
      DATABASE_URL: "postgresql://synapse:${POSTGRES_PASSWORD}@postgres:5432/synapse"
      SLACK_DB: /bridges/slack/slack.db
      DISCORD_DB: /bridges/discord/discord.db
    volumes:
      - ./data/listener:/data
      - ./data/mautrix-slack:/bridges/slack:ro
      - ./data/mautrix-discord:/bridges/discord:ro

  pixdesk-sender:
    build: ./services/sender
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_started
    profiles: ["agent"]
    environment:
      MATRIX_HOMESERVER: http://synapse:8008
      MATRIX_USER_ID: "@agent:${MATRIX_SERVER_NAME}"
      MATRIX_ACCESS_TOKEN: "${AGENT_ACCESS_TOKEN}"
      DATABASE_URL: "postgresql://synapse:${POSTGRES_PASSWORD}@postgres:5432/synapse"

  pixdesk-auth-relay:
    build: ./services/auth-relay
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_started
    profiles: ["auth"]
    environment:
      MATRIX_HOMESERVER: http://synapse:8008
      MATRIX_ADMIN_USER_ID: "@admin:${MATRIX_SERVER_NAME}"
      MATRIX_ADMIN_ACCESS_TOKEN: "${ADMIN_ACCESS_TOKEN:?set ADMIN_ACCESS_TOKEN in .env}"
      DISCORD_BOT_MXID: "@discordbot:${MATRIX_SERVER_NAME}"
      SLACK_BOT_MXID: "@slackbot:${MATRIX_SERVER_NAME}"
      TELEGRAM_BOT_MXID: "@telegrambot:${MATRIX_SERVER_NAME}"
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?set RELAY_SHARED_SECRET in .env}"
      GMAIL_CLIENT_ID: "${GMAIL_CLIENT_ID:-}"
      GMAIL_CLIENT_SECRET: "${GMAIL_CLIENT_SECRET:-}"
      GMAIL_REDIRECT_URI: "${GMAIL_REDIRECT_URI:-http://127.0.0.1:8765/login/gmail/callback}"
      GMAIL_TOKEN_DIR: /data/gmail
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data/gmail:/data/gmail

  pixdesk-gmail-ingester:
    build: ./services/gmail-ingester
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["gmail"]
    environment:
      DATABASE_URL: "postgresql://synapse:${POSTGRES_PASSWORD}@postgres:5432/synapse"
      GMAIL_CLIENT_ID: "${GMAIL_CLIENT_ID:-}"
      GMAIL_CLIENT_SECRET: "${GMAIL_CLIENT_SECRET:-}"
      GMAIL_TOKEN_DIR: /data/gmail
      GMAIL_STATE_DIR: /data/gmail-ingester
      POLL_SECONDS: "${GMAIL_POLL_SECONDS:-30}"
      COLD_START_LIMIT: "${GMAIL_COLD_START_LIMIT:-200}"
      COLD_START_QUERY: "${GMAIL_COLD_START_QUERY:-newer_than:30d}"
    volumes:
      - ./data/gmail:/data/gmail:ro
      - ./data/gmail-ingester:/data/gmail-ingester

  pixdesk-gmail-sender:
    build: ./services/gmail-sender
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["gmail"]
    environment:
      DATABASE_URL: "postgresql://synapse:${POSTGRES_PASSWORD}@postgres:5432/synapse"
      GMAIL_CLIENT_ID: "${GMAIL_CLIENT_ID:-}"
      GMAIL_CLIENT_SECRET: "${GMAIL_CLIENT_SECRET:-}"
      GMAIL_TOKEN_DIR: /data/gmail
      POLL_SECONDS: "${GMAIL_SENDER_POLL_SECONDS:-10}"
    volumes:
      - ./data/gmail:/data/gmail:ro

  pixdesk-ticket-api:
    build: ./services/ticket-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tickets"]
    environment:
      DATABASE_URL: "postgresql://synapse:${POSTGRES_PASSWORD}@postgres:5432/synapse"
      TICKET_API_SHARED_SECRET: "${TICKET_API_SHARED_SECRET:?set TICKET_API_SHARED_SECRET in .env}"
      ATTACHMENT_DIR: /data/tickets
      MAX_ATTACHMENT_BYTES: "${TICKET_MAX_ATTACHMENT_BYTES:-52428800}"
      MAX_TOTAL_ATTACHMENT_BYTES_PER_TICKET: "${TICKET_MAX_TOTAL_BYTES:-52428800}"
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - ./data/tickets:/data/tickets

  pixdesk-ticket-widget:
    build: ./services/ticket-widget
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pixdesk-ticket-api:
        condition: service_started
    profiles: ["tickets"]
    environment:
      DATABASE_URL: "postgresql://synapse:${POSTGRES_PASSWORD}@postgres:5432/synapse"
      MATRIX_HOMESERVER: http://synapse:8008
      MATRIX_ADMIN_ACCESS_TOKEN: "${ADMIN_ACCESS_TOKEN:?set ADMIN_ACCESS_TOKEN in .env}"
      TICKET_API_URL: http://pixdesk-ticket-api:8766
      TICKET_API_SHARED_SECRET: "${TICKET_API_SHARED_SECRET}"
      WIDGET_COOKIE_SECRET: "${WIDGET_COOKIE_SECRET:?set WIDGET_COOKIE_SECRET in .env}"
      PUBLIC_BASE_URL: "${WIDGET_PUBLIC_BASE_URL:-http://192.168.72.185:8767}"
      ELEMENT_ORIGIN: "${ELEMENT_ORIGIN:-http://192.168.72.185:8080}"
    ports:
      - "0.0.0.0:8767:8767"
